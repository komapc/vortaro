name: Test

# Deploy lives in deploy.yml (Cloudflare Pages, runs the tests itself). The old
# job here pushed the whole repo to a gh-pages branch that nothing serves
# (GitHub Pages is the legacy-redirect branch), so it was removed.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 20
        cache: npm

    - run: npm ci --no-audit --no-fund

    - name: Lint
      run: npm run lint
      continue-on-error: true  # advisory until the backlog is cleared

    # One run covers both: coverage includes the plain test results.
    - name: Tests with coverage
      run: npm run test:coverage

    - uses: codecov/codecov-action@v7
      with:
        files: ./coverage/lcov.info
        fail_ci_if_error: false
